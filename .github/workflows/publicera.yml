name: Hämta och publicera bloggen

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max antal nya inlägg (0 = alla). Använd t.ex. 5 för ett test."
        default: "0"
      refresh:
        description: "Hämta om inlägg som redan är sparade"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alvert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hämta inlägg från alvert.se
        run: python scraper/scrape.py --limit "${{ inputs.limit }}" ${{ inputs.refresh && '--refresh' || '' }}

      - name: Spara inläggen i repot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Inga nya inlägg att spara"
          else
            git commit -m "Hämtade inlägg $(date -u +%Y-%m-%d)"
            git push
          fi

      # Bilderna sparas i GitHubs cache mellan körningar, inte i repot
      - name: Hämta tidigare nedladdade bilder
        uses: actions/cache/restore@v4
        with:
          path: .cache/img
          key: bilder-${{ github.run_id }}
          restore-keys: bilder-

      - name: Ladda ner bilder
        run: python scraper/images.py

      - name: Spara bilderna till nästa körning
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/img
          key: bilder-${{ github.run_id }}

      - name: Bygg sajten
        run: BASE_PATH="/${{ github.event.repository.name }}" python scraper/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
