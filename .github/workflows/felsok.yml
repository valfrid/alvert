name: Felsök (tillfällig)
on:
  push:
    paths: [".github/workflows/felsok.yml"]
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          UA="Mozilla/5.0 (alvert-arkiv)"
          curl -sL -A "$UA" https://alvert.se/2021/june/ -o debug/month.html
          curl -sL -A "$UA" https://alvert.se/2021/june/sista-veckan.html -o debug/post.html || true
          curl -sL -A "$UA" https://alvert.se/ -o debug/home.html
          curl -sL -A "$UA" "https://alvert.se/index.rss" -o debug/rss.xml || true
          ls -la debug
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug && git commit -m "Felsökning: råa sidor" && git push
